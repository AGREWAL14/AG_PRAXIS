rationale:
  columns_in_question: >-
    Twelve columns matched both the protocol and the statistical name rule and
    were assigned to protocol: Header_Length, the six flag_number columns (fin,
    syn, rst, psh, ack, ece, cwr), and the count columns ack_count, syn_count,
    fin_count, rst_count.
  evidence: >-
    The dataset documentation describes Header_Length as the mean transport
    layer header length, and the flag_number columns as the proportion of
    packets carrying each flag. Both are therefore statistical operations
    applied to protocol attributes. The NB01 value ranges agree: the
    flag_number columns fall between 0 and 1, the count columns are non-integer
    averages, and Header_Length reaches 9.58e6 across 15,786 distinct values in
    a single file.
  decision: >-
    The families are separated by what is measured rather than how it is
    summarised. The statistical family holds summaries of packet size and
    volume. The protocol family holds protocol identity and flag behaviour,
    including how often flags appear. On that basis the twelve belong to
    protocol.
  open_points: >-
    The count columns are not covered by the documentation quoted above. Their
    assignment rests on their value ranges alone.
  effect_on_downstream: >-
    The assignment does not affect the timing family, which is unambiguous —
    Duration, Rate, Srate, IAT — and is the only family excluded downstream in
    NB09. NB03 measured protocol at 0.1802 and statistical at 0.1198 for
    capture identification against timing at 0.9301, so neither of the two
    families in question carries the provenance signal wherever these columns
    sit.
  timing_family_size: >-
    The timing family lists five columns. Drate is dropped before modelling as
    constant across the whole dataset (NB01, full scan, all 8,775,013 rows), so
    four reach any downstream stage: Duration, Rate, Srate, IAT. Notebooks
    excluding the timing family should intersect the family list with the live
    column list rather than assuming five.
table5_reconciliation:
  resolved_on: '2026-08-07'
  matched: >-
    Dadkhah et al. (2024) Table 5 lists 39 extracted features. The released
    45-column CICIoMT2024 CSVs contain 38 of those 39 once names are normalised:
    "fin flag number" against fin_flag_number, "Tot Sum" against "Tot sum", and
    "Tot Size (Avg.)" against "Tot size". The last of those pairs 1:1 with a
    second, separately listed Table 5 feature rather than duplicating the first.
  missing_from_data: >-
    One Table 5 feature, Time-To-Live, has no corresponding column in the
    released data. This is a genuine paper-against-data gap, not a naming
    artefact.
  extra_in_data: >-
    Seven released columns are not in Table 5 at all: Duration, Srate, Drate,
    Magnitue, Radius, Covariance, Weight. All seven are engineered features
    rather than label or metadata columns, which is why label_columns above is
    empty and stays empty.
  provenance_of_extras: >-
    Table 5 carries the caption "Features extracted from PCAP files [28]", and
    reference [28] is Neto et al.'s CICIoT2023 paper. The lineage is therefore an
    explicit citation with a named source, checked against the source PDF on
    2026-08-07 and recorded in DECISIONS.md under that date. An earlier version
    of this entry credited the claim to Dadkhah et al.'s methodology section
    instead. That was wrong: Section 5 describes the extraction as TCPDUMP and
    DPKT with window averaging and does not mention CICIoT2023 at all, so the
    citation in the Table 5 caption is the whole of the support and is firmer
    than what it replaces. None of this settles the seven columns. The citation
    covers the 39 features Table 5 lists, and the seven extras are exactly the
    columns that table does not list, so they sit outside what is cited rather
    than inside it. Neto et al.'s own feature table still has not been read, and
    this project holds no record of that schema to check against: it is not
    documented in this file, and a search of the repository found no description
    of it anywhere else. The seven stay unverified. What has changed is the kind
    of unverified — a cited claim whose source can be looked up, rather than an
    attribution resting on the paper's own account of its pipeline. Anyone who
    needs the provenance of these seven columns to hold should read Neto et al.
    directly.
  magnitue_spelling: >-
    "Magnitue" is the released dataset's misspelling of "Magnitude". The
    statistical family above carries the column under the released spelling, so
    the family list matches the CSV header as read. The handling of the typo
    itself sits in the name rules in src/inventory.py, which match both
    spellings, so a corrected header would land in the same family.
  effect_on_downstream: >-
    None. Drate is the only column constant across the whole dataset (NB01 full
    scan, all 8,775,013 rows) and is the one dropped, leaving 44 modelling
    features. That is the working set already in use. This entry records how the
    working set relates to Table 5's 39 rather than changing it.
